{% set name = "flask-wtf" %}
{% set version = "1.3.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|lower|replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 61d5dabc50c3df885c297dcbd80810443a5d632106c8a69cab8ce740f0cdd7cc

build:
  skip: true  # [py<310]
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - flask
    - wtforms
    - itsdangerous

test:
  source_files:
    - tests
  imports:
    - flask_wtf
    - flask_wtf.recaptcha
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -vv tests

about:
  home: https://github.com/wtforms/flask-wtf
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.rst
  summary: Simple integration of Flask and WTForms
  description: |
    Flask-WTF is a simple integration of Flask and WTForms including CSRF,
    file upload and reCAPTCHA.
  dev_url: https://github.com/wtforms/flask-wtf
  doc_url: https://flask-wtf.readthedocs.io

extra:
  recipe-maintainers:
    - pmlandwehr
    - xylar
